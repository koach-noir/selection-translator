<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings</title>
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <div id="settings-container">
      <h2>Settings</h2>

      <section>
        <h3>Display</h3>
        <label>
          Opacity
          <input type="range" id="opacity" min="0.3" max="1.0" step="0.05" />
          <span id="opacity-value"></span>
        </label>
        <label>
          Font Size (px)
          <input type="number" id="fontSize" min="10" max="32" />
        </label>
        <label>
          Font Color
          <input type="color" id="fontColor" />
        </label>
        <label>
          Background Color
          <input type="color" id="backgroundColor" />
        </label>
        <label>
          Border Radius (px)
          <input type="number" id="borderRadius" min="0" max="24" />
        </label>
        <label>
          Shadow
          <input type="checkbox" id="shadow" />
        </label>
      </section>

      <section>
        <h3>Behavior</h3>
        <label>
          Min Text Length
          <input type="number" id="minLength" min="1" max="100" />
        </label>
        <label>
          English Only
          <input type="checkbox" id="englishOnly" />
        </label>
      </section>

      <button id="save-btn">Save</button>
      <div id="status"></div>
    </div>
    <script type="module" src="./settings.ts"></script>
  </body>
</html>
